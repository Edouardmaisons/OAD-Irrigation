<script>
        let map = L.map('map').setView([48.858844, 2.294351], 15);
    map.doubleClickZoom.disable();
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles © Esri'

        let currentLine = [];

        let heureDepart = null;
        let firstPassage = true;
        let passageIndex = 0;
let labelMarkers = [];

        function startDrawing() {
            map.on('click', addPoint);
        }

        function addPoint(e) {
            currentLine.push(e.latlng);
            if (lineLayer) map.removeLayer(lineLayer);
            lineLayer = L.polyline(currentLine, { color: 'blue' }).addTo(map);
        }

        function calculateTotalDistance(points) {
            let dist = 0;
            for (let i = 1; i < points.length; i++) {
                dist += map.distance(points[i - 1], points[i]);
            }
            return dist;
        }

        function formatTime(date) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function parseHeure(h) {
            const [hours, minutes] = h.split(":").map(Number);
            const now = new Date();
            now.setHours(hours, minutes, 0, 0);
            return now;
        }

        function calculateEndTime(start, dist, vitesse) {
            const dureeHeures = dist / vitesse;
            const end = new Date(start.getTime());
            end.setMinutes(end.getMinutes() + dureeHeures * 60);
            return end;
        }

        function validerPassage() {
            if (currentLine.length < 2) {
                alert("Trace au moins deux points !");
                return;
            }

            const distance = Math.round(calculateTotalDistance(currentLine));
            let vitesse = parseFloat(prompt("Vitesse d’enroulement (m/h) :", "20"));
            if (!vitesse || vitesse <= 0) {
                alert("Vitesse invalide");
                return;
            }

            if (firstPassage) {
                let h = prompt("Heure de départ du premier passage (HH:MM)", "06:00");
                if (!h || !h.match(/^\d{1,2}:\d{2}$/)) {
                    alert("Format d'heure invalide.");
                    return;
                }
                heureDepart = parseHeure(h);
                firstPassage = false;
            }

            const fin = calculateEndTime(heureDepart, distance, vitesse);
            passageIndex += 1;

            const log = document.getElementById("log");
            const item = document.createElement("li");
            item.innerText = `Passage ${passageIndex} (${heureDepart.toLocaleDateString()}): ${formatTime(heureDepart)} → ${formatTime(fin)} (${distance} m)`;
            log.appendChild(item);

            const poly = L.polyline(currentLine, { color: 'green' }).addTo(map);
    // Affichage de la longueur au milieu de la ligne (testé OK)
    const midIdx = Math.floor(currentLine.length / 2);
    const midPoint = currentLine[midIdx];
    const label = L.marker(midPoint, {
        icon: L.divIcon({
            className: 'passage-label',
            html: '<b>' + distance + ' m</b>',
            iconSize: [60, 20],
            iconAnchor: [30, 10]
        })
    }).addTo(map);
    labelMarkers.push(label);
        
    const labelLatLng = currentLine[0];
    const labelMarker = L.marker(labelLatLng, {
        icon: L.divIcon({
            className: 'passage-label',
            html: '<b>' + passageIndex + '</b>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        })
    }).addTo(map);
    allLines.push(poly);
            currentLine = [];
            if (lineLayer) map.removeLayer(lineLayer);
            lineLayer = null;

            const interval = parseInt(document.getElementById("intervalInput").value) || 0;
            heureDepart = new Date(fin.getTime() + interval * 60000);
        }

        document.getElementById("geolocate-btn").addEventListener("click", () => {
            if (!navigator.geolocation) {
                alert("La géolocalisation n'est pas supportée.");
                return;
            }
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude, longitude } = pos.coords;
                map.setView([latitude, longitude], 17);
                L.marker([latitude, longitude]).addTo(map).bindPopup("Vous êtes ici.").openPopup();
            });
        });

        document.getElementById("create-markers-btn").addEventListener("click", () => {
    const nb = parseInt(prompt("Combien de marqueurs veux-tu placer entre deux points ?", "5"));
    const spacing = parseFloat(prompt("Quelle distance (en mètres) entre chaque marqueur ?", "72"));
    const hoseLength = parseFloat(document.getElementById("hoseLength").value);

    if (isNaN(nb) || nb <= 0 || isNaN(spacing) || spacing <= 0 || isNaN(hoseLength) || hoseLength <= 0) {
        alert("Entrées invalides.");
        return;
    }

    alert("Clique sur deux points pour définir une ligne (A → B).");

    let points = [];
    const handler = e => {
        points.push(e.latlng);
        if (points.length === 2) {
            let [p1, p2] = points;

            const currentDist = map.distance(p1, p2);
            const requiredDist = spacing * nb;
            if (currentDist < requiredDist + spacing / 2) {
                const dx = p2.lat - p1.lat;
                const dy = p2.lng - p1.lng;
                const norm = Math.sqrt(dx * dx + dy * dy);
                const scale = (requiredDist + spacing / 2) / currentDist;
                p2 = L.latLng(p1.lat + dx * scale, p1.lng + dy * scale);
            }

            L.polyline([p1, p2], { color: 'red', weight: 2 }).addTo(map);
            const totalDist = map.distance(p1, p2);

            const pointA = map.project(p1);
            const pointB = map.project(p2);
            const angle = Math.atan2(pointB.y - pointA.y, pointB.x - pointA.x) + Math.PI / 2;

            for (let i = 0; i < nb; i++) {
                const offset = (spacing / 2) + i * spacing;
                const frac = offset / totalDist;
                const lat = p1.lat + frac * (p2.lat - p1.lat);
                const lng = p1.lng + frac * (p2.lng - p1.lng);
                const markerLatLng = L.latLng(lat, lng);

                L.circleMarker(markerLatLng, {
                    radius: 5,
                    color: 'blue',
                    fillOpacity: 1
                }).addTo(map);

                const center = map.project(markerLatLng);
                const dx = Math.cos(angle) * (hoseLength / 2);
                const dy = Math.sin(angle) * (hoseLength / 2);

                const pt1 = map.unproject(L.point(center.x + dx, center.y + dy));
                const pt2 = map.unproject(L.point(center.x - dx, center.y - dy));

                L.polyline([pt1, pt2], { color: 'black', weight: 1 }).addTo(map);
            }

            map.off('click', handler);
        }
    };
    map.on('click', handler);
});

<script>
function supprimerDernierPassage() {
    if (allLines.length > 0) {
        let lastLine = allLines.pop();
        map.removeLayer(lastLine);
    }

    if (labelMarkers.length > 0) {
        const lastLabel = labelMarkers.pop();
        map.removeLayer(lastLabel);
    }

    let log = document.getElementById("log");
    if (log.lastChild) {
        log.removeChild(log.lastChild);
    }

    passageIndex = Math.max(0, passageIndex - 1);
}

function reinitialiserTout() {
    currentLine = [];
    if (lineLayer) map.removeLayer(lineLayer);
    lineLayer = null;
    allLines.forEach(l => map.removeLayer(l));
    allLines = [];
    labelMarkers.forEach(m => map.removeLayer(m));
    labelMarkers = [];
    passageIndex = 0;
    firstPassage = true;
    heureDepart = null;

    // Supprimer tous les marqueurs de passage (divIcon inclus)
    map.eachLayer(layer => {
        if (layer instanceof L.Marker || layer instanceof L.CircleMarker || (layer instanceof L.Polyline && !layer._url)) {
            map.removeLayer(layer);
        }
    });

    document.getElementById("log").innerHTML = '';
}

function openTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.querySelector(`[onclick="openTab('${tabId}')"]`).classList.add('active');
}


function genererRecap() {
    openTab('recap');
    const recap = document.getElementById('recap');
    recap.innerHTML = '';
    const table = document.createElement('table');
    table.style.borderCollapse = 'collapse';
    table.style.width = '100%';

    const thead = document.createElement('thead');

    headers.forEach(h => {
        const th = document.createElement('th');
        th.innerText = h;
        th.style.border = '1px solid #aaa';
        th.style.padding = '4px';
        th.style.background = '#eee';
        headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    const lignes = document.querySelectorAll('#log li');
    lignes.forEach((li, index) => {
        const tr = document.createElement('tr');
        const parts = li.textContent.match(/Passage (\d+) \(([^)]+)\): (\d{2}:\d{2}) → (\d{2}:\d{2}) \((\d+) m\)/);
        if (parts) {
            const id = parts[1];
            const date = parts[2];
            const start = parts[3];
            const dist = parseInt(parts[5]);
            const vitesse = 20;
            const interval = parseInt(document.getElementById("intervalInput").value) || 30;

            const tds = [id, date, start, "", dist, vitesse, interval];
            tds.forEach((val, colIndex) => {
                const td = document.createElement('td');
                if (colIndex >= 5) {
                    const input = document.createElement('input');
                    input.type = "number";
                    input.value = val;
                    input.style.width = "70px";
                    input.oninput = () => recalculateTable();
                    td.appendChild(input);
                } else if (colIndex === 3) {
                    td.innerText = ""; // Heure fin
                } else {
                    td.innerText = val;
                }
                td.style.border = '1px solid #ccc';
                td.style.padding = '4px';
                tr.appendChild(td);
            });
        }
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    recap.appendChild(table);
    recalculateTable();
}

function recalculateTable() {
    const rows = document.querySelectorAll('#recap table tbody tr');
    let lastEndTime = null;

    rows.forEach((row, i) => {
        const cells = row.querySelectorAll('td');
        const date = cells[1].innerText;
        const heureDepart = i === 0 ? cells[2].innerText : lastEndTime;
        const dist = parseFloat(cells[4].innerText);
        const vitesse = parseFloat(cells[5].querySelector('input').value);
        const interval = parseFloat(cells[6].querySelector('input').value);

        const [h, m] = heureDepart.split(":").map(Number);
        const startTime = new Date();
        const [day, month, year] = date.split("/");
        startTime.setFullYear(parseInt(year), parseInt(month) - 1, parseInt(day));
        startTime.setHours(h, m, 0, 0);

        const dureeHeures = dist / vitesse;
        const endTime = new Date(startTime.getTime() + dureeHeures * 3600 * 1000);
        const endH = String(endTime.getHours()).padStart(2, '0') + ":" + String(endTime.getMinutes()).padStart(2, '0');

        cells[2].innerText = (i === 0 ? heureDepart : lastEndTime);
        cells[3].innerText = endH;
        const nextStart = new Date(endTime.getTime() + interval * 60000);
        lastEndTime = String(nextStart.getHours()).padStart(2, '0') + ":" + String(nextStart.getMinutes()).padStart(2, '0');
    });
}

function tracerCourbe() {
    let courbePoints = [];
    const nb = parseInt(prompt("Combien de marqueurs veux-tu ?", "5"));
    const spacing = parseFloat(prompt("Distance entre marqueurs (m)", "72"));
    const hoseLength = parseFloat(document.getElementById("hoseLength").value);

    if (!nb || !spacing || !hoseLength) {
        alert("Entrée invalide");
        return;
    }

    alert("Clique sur plusieurs points pour dessiner la courbe. Double-clique pour terminer.");

    let polyLayer = null;
    let drawing = true;

    function onClick(e) {
        if (!drawing) return;
        courbePoints.push(e.latlng);
        if (polyLayer) map.removeLayer(polyLayer);
        polyLayer = L.polyline(courbePoints, { color: 'orange' }).addTo(map);
    }

    function onDblClick() {
        drawing = false;
        map.off("click", onClick);
        map.off("dblclick", onDblClick);

        // Interpolation
        const projected = courbePoints.map(p => map.project(p));
        const dists = [0];
        for (let i = 1; i < projected.length; i++) {
            const d = projected[i].distanceTo(projected[i - 1]);
            dists.push(dists[i - 1] + d);
        }

        const totalLength = dists[dists.length - 1];
        const totalMarkers = nb;
        const interval = spacing;
        const requiredLength = interval * totalMarkers;

        if (totalLength < requiredLength) {
            alert("La courbe est trop courte.");
            return;
        }

        for (let i = 0; i < totalMarkers; i++) {
            const distTarget = (spacing / 2) + i * spacing;
            let j = 1;
            while (j < dists.length && dists[j] < distTarget) j++;
            const ratio = (distTarget - dists[j - 1]) / (dists[j] - dists[j - 1]);
            const interpX = projected[j - 1].x + ratio * (projected[j].x - projected[j - 1].x);
            const interpY = projected[j - 1].y + ratio * (projected[j].y - projected[j - 1].y);
            const markerPoint = L.point(interpX, interpY);
            const markerLatLng = map.unproject(markerPoint);

            L.circleMarker(markerLatLng, {
                radius: 5,
                color: 'blue',
                fillOpacity: 1
            }).addTo(map);

            // Tangente locale
            const dx = projected[j].x - projected[j - 1].x;
            const dy = projected[j].y - projected[j - 1].y;
            const angle = Math.atan2(dy, dx) + Math.PI / 2;

            const perp_dx = Math.cos(angle) * (hoseLength / 2);
            const perp_dy = Math.sin(angle) * (hoseLength / 2);
            const pt1 = L.point(interpX + perp_dx, interpY + perp_dy);
            const pt2 = L.point(interpX - perp_dx, interpY - perp_dy);
            const m1 = map.unproject(pt1);
            const m2 = map.unproject(pt2);

            L.polyline([m1, m2], { color: 'black', weight: 1 }).addTo(map);
        }
    }

    map.on("click", onClick);
    map.on("dblclick", onDblClick);
}

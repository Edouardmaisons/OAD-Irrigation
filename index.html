<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Gestion de Ferme</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 1rem; }
    #map { height: 400px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Gestion de Ferme</h1>
  <div id="map"></div>
  <div>
    <input id="field-name" placeholder="Nom de la parcelle" />
    <input id="field-crop" placeholder="Culture" />
    <button id="save-field">Enregistrer la parcelle</button>
  </div>
  <script>
    const map = L.map('map').setView([48.86, 2.35], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
      edit: { featureGroup: drawnItems },
      draw: { polyline: false, circle: false, rectangle: false, marker: false, circlemarker: false }
    });
    map.addControl(drawControl);

    let currentLayer = null;
    map.on(L.Draw.Event.CREATED, function (e) {
      if (currentLayer) drawnItems.removeLayer(currentLayer);
      currentLayer = e.layer;
      drawnItems.addLayer(currentLayer);
    });

    document.getElementById('save-field').onclick = async () => {
      if (!currentLayer) { alert('Dessinez une parcelle.'); return; }
      const geojson = currentLayer.toGeoJSON();
      const field = {
        name: document.getElementById('field-name').value,
        crop: document.getElementById('field-crop').value,
        geometry: JSON.stringify(geojson.geometry)
      };
      await fetch('/fields/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(field)
      });
      alert('Parcelle enregistrée');
    };
  </script>
</body>
</html>
